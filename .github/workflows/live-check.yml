name: live-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://rebootmedia.us/before-your-call https://rebootmedia.us/before-your-call/ https://www.rebootmedia.us/before-your-call https://rewebsite-er0.pages.dev/before-your-call https://rebootmedia.us/; do
            echo "===== $u"; curl -sS -I --max-time 20 "$u"
          done
          echo "===== body asset refs"
          curl -sS https://rebootmedia.us/before-your-call | grep -oE 'assets/index-[^"]+' || true
          curl -sS https://rewebsite-er0.pages.dev/ | grep -oE 'assets/index-[^"]+' || true
          echo "===== live _redirects"; curl -sS https://rebootmedia.us/_redirects | head -20
