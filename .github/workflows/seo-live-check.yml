# Temporary: reads the live site from a GitHub runner (the only route that reaches it). Removed before merge.
name: seo-live-check
on:
  push:
    branches: [claude/project-thread-6nw6m7]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live pages
        run: |
          for p in / /visibility-check /before-your-call /scale /robots.txt /sitemap.xml /llms.txt /this-page-does-not-exist /scale/; do
            echo "=================== $p"
            curl -sS -o body.txt -D - "https://rebootmedia.us$p" -A "GPTBot/1.1" | grep -iE '^(HTTP|content-type|x-robots-tag|location)'
            grep -oE '<title>[^<]*</title>|<link rel="canonical"[^>]*>|<meta name="robots"[^>]*>|<h1[^>]*>|application/ld\+json|<div id="root">[^<]{0,80}' body.txt | head -8
            echo "bytes: $(wc -c < body.txt)"
          done
