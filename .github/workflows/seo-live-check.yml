# Temporary: checks this branch's Cloudflare preview from a GitHub runner. Removed before merge.
name: seo-preview-check
on:
  push:
    branches: [claude/project-thread-6nw6m7]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch preview pages
        run: |
          H=https://claude-project-thread-6nw6m7.rewebsite-er0.pages.dev
          for i in $(seq 1 40); do
            curl -s "$H/visibility-check" | grep -q "Free Visibility Check for Roofing" && break
            sleep 15
          done
          for p in / /visibility-check /before-your-call /grow /scale /commercial /robots.txt /sitemap.xml /llms.txt /nope /scale/ /roofers; do
            echo "=================== $p"
            curl -sS -o body.txt -D - "$H$p" -A "GPTBot/1.1" | grep -iE '^(HTTP|content-type|x-robots-tag|location)'
            grep -oE '<title>[^<]*</title>|<link rel="canonical"[^>]*>|<meta name="robots"[^>]*>|application/ld\+json' body.txt | head -6
            grep -oE '<h1[^>]*>(<[^>]*>)*[^<]{0,80}' body.txt | sed 's/<[^>]*>//g' | head -1
            echo "bytes: $(wc -c < body.txt)"
          done
          curl -s "$H/robots.txt" | head -3
