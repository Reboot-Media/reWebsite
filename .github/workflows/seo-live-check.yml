name: questions-live-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          for p in roofing-marketing-questions sitemap.xml; do echo "== $p"; curl -s -o out -w '%{http_code}\n' https://rebootmedia.us/$p; grep -o '<title>[^<]*' out; grep -c 'roofing-marketing-questions\|You pick the jobs\|confirm the appointment. By the time' out; done
          curl -s https://rebootmedia.us/ | grep -o 'alt="Reboot Media logo"' | wc -l
